<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            background-color: rgb(47, 44, 44);
        }
        div{
            width: 300px;
            background-color: red;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            
        }
        div input{
            padding: 6px;
        }
        #bt{
            cursor: pointer;
            color: white;
            padding: 4px;
            background-color: blue;
            width: 50%;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
        }
        #bt:hover{
            background-color: rgb(43, 43, 248);
        }

    </style>
</head>
<body>
    <div>
        <input id="E" type="text" placeholder="name">
        <button onclick="cll()" id="bt">logi</button>
    </div>
    <script>
        
        function cll(){
        let name = document.getElementById("E")
            if(name.value === ''){
                return alert("plase form")
            }else{
                setTimeout(()=>{
                    location.href = 'home.html'
                    
                },3000)
                
            }
            
        }
    </script>
</body>
</html>
